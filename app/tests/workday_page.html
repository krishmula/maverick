<!doctype html>
<!--
  A RECONSTRUCTION of one page of a Workday application, not a copy of one. Nobody signed in to
  Workday to make it. The markup follows Workday's public page scripts (release 2026.47.19) and
  the atsfill project's notes on the signed-in wizard. See the top of core/src/workday.rs.
  These parts follow the structure of live pages seen signed in, in November 2026: the search
  lists, the date boxes, the list of jobs, the footer, the list of errors and the last page.
  Every name and value here is made up.
-->
<title>Reconstructed Workday page</title>
<style>
  [data-automation-id^="formField-"] { margin: 12px 0; }
  .box { position: relative; display: inline-block; width: 20px; height: 20px; }
  .box input { position: absolute; inset: 0; margin: 0; opacity: 0; }
  .box div { position: absolute; inset: 0; border: 1px solid; pointer-events: none; }
  /* Not from Workday: the drawn box takes the click here, to try the click on the label. */
  .box.drawn-over div { pointer-events: auto; }
  [role="listbox"] { border: 1px solid; margin: 0; padding: 0; list-style: none; width: 240px; background: white; }
</style>
<div data-automation-id="applyFlowPage">
  <h2 data-automation-id="jobTitleHeading">Backend Engineer</h2>
  <ol data-automation-id="progressBar">
    <li data-automation-id="progressBarCompletedStep"><div>step 1 of 6</div><label>Create Account/Sign In</label></li>
    <li data-automation-id="progressBarActiveStep"><div>current step 2 of 6</div><label>My Information</label></li>
    <li data-automation-id="progressBarInactiveStep"><div>step 3 of 6</div><label>My Experience</label></li>
  </ol>
  <div data-automation-id="applyFlowMyInfoPage">
    <div role="group" aria-labelledby="Legal-Name-section" data-fkit-id="name--legalName">
      <h4 id="Legal-Name-section">Legal Name</h4>
      <div data-automation-id="formField-firstName" data-fkit-id="name--legalName--firstName">
        <label for="name--legalName--firstName"><span>First Name<abbr aria-hidden="true">*</abbr></span></label>
        <div><input type="text" id="name--legalName--firstName" aria-required="true" value="Prefilled Person"></div>
      </div>
    </div>

    <div data-automation-id="formField-countryPhoneCode" data-fkit-id="phoneNumber--countryPhoneCode">
      <label for="phoneNumber--countryPhoneCode"><span>Country Phone Code<abbr aria-hidden="true">*</abbr></span></label>
      <div data-automation-id="multiSelectContainer" data-uxi-widget-type="multiselect" data-options="Canada (+1)|United States of America (+1)">
        <div data-automation-id="multiselectInputContainer">
          <input id="phoneNumber--countryPhoneCode" placeholder="Search" data-uxi-widget-type="selectinput" aria-required="true" value="">
          <div data-automation-id="promptSelectionLabel"></div>
          <span data-automation-id="promptIcon"></span>
        </div>
        <ul role="listbox" data-automation-id="selectedItemList" aria-label="items selected">
          <li role="presentation" data-automation-id="menuItem">
            <div role="option" data-automation-id="selectedItem" aria-label="United States of America (+1), press delete to clear value.">
              <p data-automation-id="promptOption" data-automation-label="United States of America (+1)">United States of America (+1)</p>
            </div>
          </li>
        </ul>
      </div>
    </div>

    <div data-automation-id="formField-phoneNumber" data-fkit-id="phoneNumber--phoneNumber">
      <label for="phoneNumber--phoneNumber"><span>Phone Number<abbr aria-hidden="true">*</abbr></span></label>
      <div><input type="text" id="phoneNumber--phoneNumber" aria-required="true" value=""></div>
    </div>

    <div data-automation-id="formField-countryRegion" data-fkit-id="address--countryRegion">
      <label for="address--countryRegion"><span>State<abbr aria-hidden="true">*</abbr></span></label>
      <div>
        <button type="button" id="address--countryRegion" aria-haspopup="listbox" aria-label="State Select One Required" value="" data-options="Illinois|Ohio">Select One</button>
        <input type="text" value="" style="display: none">
      </div>
    </div>

    <fieldset data-automation-id="formField-candidateIsPreviousWorker" data-fkit-id="previousWorker--candidateIsPreviousWorker">
      <legend><span>Have you worked for Example Co before?<abbr aria-hidden="true">*</abbr></span></legend>
      <div>
        <span class="box"><input type="radio" id="worked-1" name="worked" value="true" aria-checked="false"><div></div></span>
        <label for="worked-1">Yes</label>
      </div>
      <div>
        <span class="box"><input type="radio" id="worked-2" name="worked" value="false" aria-checked="false"><div></div></span>
        <label for="worked-2">No</label>
      </div>
    </fieldset>

    <div data-automation-id="formField-preferredCheck" data-fkit-id="name--preferredCheck">
      <span class="box"><input type="checkbox" id="name--preferredCheck" aria-checked="false"><div></div></span>
      <label for="name--preferredCheck">I have a preferred name</label>
    </div>

    <fieldset data-automation-id="formField-q1" data-fkit-id="primaryQuestionnaire--q1">
      <legend><span>Which offices could you work from?</span></legend>
      <div>
        <span class="box"><input type="checkbox" id="office-1"><div></div></span>
        <label for="office-1">Springfield</label>
      </div>
      <div>
        <span class="box"><input type="checkbox" id="office-2"><div></div></span>
        <label for="office-2">Shelbyville</label>
      </div>
      <div>
        <span class="box drawn-over"><input type="checkbox" id="office-3"><div></div></span>
        <label for="office-3">Remote</label>
      </div>
    </fieldset>

    <div data-automation-id="formField-q2" data-fkit-id="primaryQuestionnaire--q2">
      <label for="primaryQuestionnaire--q2"><span>Anything else we should know?</span></label>
      <div><textarea id="primaryQuestionnaire--q2"></textarea></div>
    </div>

    <div data-automation-id="formField-q3" data-fkit-id="primaryQuestionnaire--q3">
      <label for="primaryQuestionnaire--q3-dateSectionMonth-input"><span>When can you start?</span></label>
      <div data-automation-id="dateInputWrapper" role="group">
        <div data-automation-id="dateSectionMonth-display" aria-hidden="true">MM</div>
        <input id="primaryQuestionnaire--q3-dateSectionMonth-input" data-automation-id="dateSectionMonth-input" role="spinbutton" value="">
        <div data-automation-id="dateSectionDay-display" aria-hidden="true">DD</div>
        <input id="primaryQuestionnaire--q3-dateSectionDay-input" data-automation-id="dateSectionDay-input" role="spinbutton" value="">
        <div data-automation-id="dateSectionYear-display" aria-hidden="true">YYYY</div>
        <input id="primaryQuestionnaire--q3-dateSectionYear-input" data-automation-id="dateSectionYear-input" role="spinbutton" value="">
      </div>
    </div>

    <div data-automation-id="formField-attachments" data-fkit-id="resumeAttachments--attachments">
      <label for="resumeAttachments--attachments"><span>Resume/CV<abbr aria-hidden="true">*</abbr></span></label>
      <div data-automation-id="file-upload-drop-zone">
        <input type="file" id="resumeAttachments--attachments" data-automation-id="file-upload-input-ref">
        <button type="button" data-automation-id="select-files">Select files</button>
      </div>
    </div>

    <div data-automation-id="formField-source" data-fkit-id="source--source">
      <label for="source--source"><span>How Did You Hear About Us?<abbr aria-hidden="true">*</abbr></span></label>
      <div data-automation-id="multiSelectContainer" data-uxi-widget-type="multiselect" data-options="LinkedIn|LinkedIn Jobs|Employee Referral">
        <div data-automation-id="multiselectInputContainer">
          <input id="source--source" placeholder="Search" data-uxi-widget-type="selectinput" aria-required="true" value="">
          <div data-automation-id="promptSelectionLabel"></div>
          <span data-automation-id="promptIcon"></span>
        </div>
        <ul role="listbox" data-automation-id="selectedItemList" aria-label="items selected"></ul>
      </div>
    </div>

    <div role="group" aria-labelledby="Work-Experience-section">
      <h4 id="Work-Experience-section">Work Experience</h4>
      <div data-entries></div>
      <button type="button" data-automation-id="add-button">Add Another</button>
    </div>

    <div data-automation-id="formField-q4" data-fkit-id="primaryQuestionnaire--q4">
      <label for="primaryQuestionnaire--q4"><span>Are you legally able to work in this country?</span></label>
      <div>
        <button type="button" id="primaryQuestionnaire--q4" aria-haspopup="listbox" value="yes" data-options="Yes|No">Yes</button>
        <input type="text" value="yes" style="display: none">
      </div>
    </div>
  </div>
  <div data-automation-id="pageFooter">
    <button type="button" data-automation-id="pageFooterNextButton">Save and Continue</button>
  </div>
</div>
<script>
  // What the test reads back: the lists that were opened, and whether the page was left.
  window.opened = [];

  // The footer, as on a live page. A press saves the page and shows the next one, which here is
  // the last: it has no field, and its button says Submit. A page with `?refuse` in its address
  // is not taken, and lists what is wrong with it.
  const next = document.querySelector('[data-automation-id="pageFooterNextButton"]');
  next.addEventListener("click", () => {
    if (next.textContent === "Submit") return (window.submitted = true);
    if (location.search.includes("refuse")) {
      document.querySelector('[data-automation-id="errorHeading"]')?.remove();
      const errors = document.createElement("div");
      errors.setAttribute("data-automation-id", "errorHeading");
      errors.innerHTML =
        '<ol><li value="1"><div><button aria-describedby="hint1"><span>Error</span><div aria-hidden="true">-</div>Postal Code</button>' +
        '<div id="hint1">The field Postal Code is required and must have a value.</div></div></li></ol>';
      document.querySelector('[data-automation-id="applyFlowPage"]').prepend(errors);
      return;
    }
    window.advanced = true;
    setTimeout(() => {
      document.querySelector('[data-automation-id="applyFlowMyInfoPage"]').outerHTML =
        '<div data-automation-id="applyFlowReviewPage"><h3>Review</h3></div>';
      document.querySelector('[data-automation-id="progressBarActiveStep"]').innerHTML =
        "<div>current step 6 of 6</div><label>Review</label>";
      next.textContent = "Submit";
    }, 300);
  });

  // A date box, as on a live page. The date reads key presses, and text that arrives changes
  // nothing. The date itself knows which of its boxes takes the keys: the one whose text was
  // clicked, or the next one after a full number, or the first one when the focus comes from
  // outside the date. A script that puts the focus in a later box does not change that, so its
  // keys go to the first box. A box holds its number without a leading zero, and the text beside
  // it shows the zero.
  const dateBox = (box) => {
    const date = box.parentElement;
    const boxes = () => [...date.querySelectorAll('[role="spinbutton"]')];
    const width = (box) => (box.getAttribute("data-automation-id").includes("Year") ? 4 : 2);
    const take = (box) => {
      date.taking = box;
      date.typed = "";
    };
    box.previousElementSibling.addEventListener("click", () => {
      take(box);
      box.focus();
    });
    box.addEventListener("focus", (event) => {
      if (!date.contains(event.relatedTarget) && date.taking !== box) take(boxes()[0]);
    });
    box.addEventListener("beforeinput", (event) => event.preventDefault());
    box.addEventListener("keydown", (event) => {
      if (!/^\d$/.test(event.key)) return;
      event.preventDefault();
      const taking = date.taking ?? boxes()[0];
      date.typed = (date.typed ?? "") + event.key;
      taking.value = String(Number(date.typed));
      taking.previousElementSibling.textContent = date.typed.padStart(width(taking), "0");
      if (date.typed.length < width(taking)) return;
      const next = boxes()[boxes().indexOf(taking) + 1];
      take(next ?? taking);
      next?.focus();
    });
  };
  document.querySelectorAll('[data-automation-id$="-input"][role="spinbutton"]').forEach(dateBox);

  // A search list, as on a live page. Enter sends the typed text to the server. With one option
  // found, the list picks it. With several, it opens with them. With none, it opens with all.
  // Tab closes the list and empties the search box.
  for (const prompt of document.querySelectorAll('[data-automation-id="multiSelectContainer"]')) {
    const input = prompt.querySelector("input");
    const picked = prompt.querySelector('[data-automation-id="selectedItemList"]');
    const options = prompt.dataset.options.split("|");
    const closeList = () => document.querySelector('[data-automation-id="responsiveMonikerPrompt"]')?.remove();
    const labelled = (element, label) => {
      const option = element.querySelector('[data-automation-id="promptOption"]');
      option.textContent = label;
      option.setAttribute("data-automation-label", label);
      return option;
    };
    const pick = (label) => {
      picked.innerHTML =
        '<li role="presentation" data-automation-id="menuItem"><div role="option" data-automation-id="selectedItem">' +
        '<p data-automation-id="promptOption"></p></div></li>';
      labelled(picked, label);
      input.value = "";
      closeList();
    };
    input.addEventListener("keydown", (event) => {
      if (event.key === "Tab") {
        input.value = "";
        closeList();
      }
      if (event.key !== "Enter") return;
      const typed = input.value.toLowerCase();
      setTimeout(() => {
        const found = options.filter((option) => option.toLowerCase().includes(typed));
        if (found.length === 1) return pick(found[0]);
        closeList();
        const popup = document.createElement("div");
        popup.setAttribute("data-automation-id", "responsiveMonikerPrompt");
        popup.innerHTML = '<div data-automation-id="activeListContainer" role="listbox" tabindex="-1"></div>';
        for (const label of found.length > 0 ? found : options) {
          const row = document.createElement("div");
          row.setAttribute("data-automation-id", "menuItem");
          row.setAttribute("role", "option");
          row.innerHTML = '<div data-automation-id="promptLeafNode"><div data-automation-id="promptOption"></div></div>';
          labelled(row, label).addEventListener("click", () => pick(label));
          popup.firstChild.append(row);
        }
        document.body.append(popup);
      }, 300);
    });
  }

  // The list of jobs, as on a live page. Workday numbers the entries as it likes. A job the
  // applicant holds now has no last month, so that field goes when the box is ticked.
  const jobs = document.querySelector('[aria-labelledby="Work-Experience-section"]');
  let entries = 0;
  const addJob = () => {
    const id = `workExperience-${2 + 5 * entries}`;
    entries += 1;
    const panel = document.createElement("div");
    panel.setAttribute("role", "group");
    panel.setAttribute("aria-labelledby", `Work-Experience-${entries}-panel`);
    panel.innerHTML = `<h5 id="Work-Experience-${entries}-panel">Work Experience ${entries}</h5>
      <div data-automation-id="formField-jobTitle" data-fkit-id="${id}--jobTitle">
        <label for="${id}--jobTitle"><span>Job Title<abbr aria-hidden="true">*</abbr></span></label>
        <div><input type="text" id="${id}--jobTitle" value=""></div>
      </div>
      <div data-automation-id="formField-currentlyWorkHere" data-fkit-id="${id}--currentlyWorkHere">
        <span class="box"><input type="checkbox" id="${id}--currentlyWorkHere"><div></div></span>
        <label for="${id}--currentlyWorkHere">I currently work here</label>
      </div>
      <div data-automation-id="formField-endDate" data-fkit-id="${id}--endDate">
        <fieldset><legend><span>To<abbr aria-hidden="true">*</abbr></span></legend>
          <div data-automation-id="dateInputWrapper" role="group" id="${id}--endDate">
            <div data-automation-id="dateSectionMonth-display" aria-hidden="true">MM</div>
            <input id="${id}--endDate-dateSectionMonth-input" data-automation-id="dateSectionMonth-input" role="spinbutton" value="">
            <div data-automation-id="dateSectionYear-display" aria-hidden="true">YYYY</div>
            <input id="${id}--endDate-dateSectionYear-input" data-automation-id="dateSectionYear-input" role="spinbutton" value="">
          </div>
        </fieldset>
      </div>`;
    panel.querySelectorAll('[role="spinbutton"]').forEach(dateBox);
    const current = panel.querySelector('input[type="checkbox"]');
    current.addEventListener("change", () => {
      if (current.checked) panel.querySelector('[data-automation-id="formField-endDate"]').remove();
    });
    jobs.querySelector("[data-entries]").append(panel);
  };
  addJob();
  jobs.querySelector('[data-automation-id="add-button"]').addEventListener("click", addJob);

  // The list as Workday's script draws it: outside the field, with the keyboard focus, naming its
  // active row. The arrow keys move that row and Enter picks it, as seen on a live page.
  let menus = 0;
  // A live list still counts as open for a moment after it is told to close.
  const close = (button) => {
    const list = document.getElementById(button.getAttribute("aria-controls") ?? "");
    setTimeout(() => {
      list?.remove();
      button.removeAttribute("aria-expanded");
      button.removeAttribute("aria-controls");
    }, 200);
  };
  for (const button of document.querySelectorAll('button[aria-haspopup="listbox"]')) {
    button.addEventListener("click", () => {
      if (button.getAttribute("aria-expanded") === "true") return close(button);
      const list = document.createElement("ul");
      list.id = `menu-${++menus}`;
      list.setAttribute("role", "listbox");
      list.tabIndex = -1;
      const labels = ["Select One", ...button.dataset.options.split("|")];
      labels.forEach((label, row) => {
        const option = document.createElement("li");
        option.id = `${list.id}-row-${row}`;
        option.setAttribute("role", "option");
        option.innerHTML = "<div></div>";
        option.firstChild.textContent = label;
        list.append(option);
      });
      let active = Math.max(0, labels.indexOf(button.textContent));
      const mark = () => list.setAttribute("aria-activedescendant", list.children[active].id);
      mark();
      list.addEventListener("keydown", (event) => {
        if (event.key === "ArrowDown") active = Math.min(labels.length - 1, active + 1);
        else if (event.key === "ArrowUp") active = Math.max(0, active - 1);
        else if (event.key === "Enter") {
          button.textContent = labels[active];
          button.value = active === 0 ? "" : `option-${active}`;
          close(button);
          button.focus();
        } else if (event.key === "Escape") {
          close(button);
          button.focus();
        }
        if (list.isConnected) mark();
      });
      document.body.append(list);
      button.setAttribute("aria-expanded", "true");
      button.setAttribute("aria-controls", list.id);
      window.opened.push(button.id);
      list.focus();
    });
  }

  const upload = document.querySelector('input[type="file"]');
  upload.addEventListener("change", () => {
    const item = document.createElement("div");
    item.setAttribute("data-automation-id", "file-upload-item");
    item.innerHTML = '<div data-automation-id="file-upload-successful"></div><div></div>';
    item.lastChild.textContent = upload.files[0].name;
    upload.closest('[data-automation-id^="formField-"]').append(item);
  });
</script>
