[package]
name = "maverick"
version = "0.2.0"
description = "The Maverick desktop app"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
gpui-kit = "0.10.0"
jiff = "1.0.2"
maverick-core = { path = "../core" }
objc2 = "0.6.5"
serde_json = "1.0.154"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData"] }
tokio = { version = "1.54.1", features = ["net", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
gpui-kit = { version = "0.10.0", features = ["test-support"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["io-util", "macros", "rt-multi-thread", "time", "sync"] }
