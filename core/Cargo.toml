[package]
name = "maverick-core"
version = "0.7.0"
description = "Everything in Maverick except the window"
edition = "2024"
publish = false

[dependencies]
base64 = "0.23.1"
dirs = "7.0.0"
fastrand = "2.5"
jiff = "1.0.2"
roxmltree = "0.21.2"
rusqlite = { version = "0.43.0", features = ["bundled"] }
scraper = "0.29"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
zip = { version = "9.8.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
